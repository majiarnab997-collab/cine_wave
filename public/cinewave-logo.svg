  </g>

  <!-- Brand Typography -->
  <text x="64" y="38" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" letter-spacing="-0.03em" fill="#FFFFFF">
    CINE<tspan fill="url(#cw-logo-gradient)">WAVE</tspan>
